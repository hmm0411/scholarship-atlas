name: Monitor official scholarship sources
on:
  schedule:
    - cron: '17 2 * * *' # Approx. 09:17 Vietnam; GitHub Actions schedule is best effort
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scholarship-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source monitor
        run: python scripts/check_sources.py
      - name: Commit public monitoring feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/updates.json data/source_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh scholarship source monitoring'
            git push
          fi
