function calendarView(){let first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();let daycells=['CN','T2','T3','T4','T5','T6','T7'].map(s=>`<div class="muted small" style="text-align:center">${s}</div>`).join('');for(let i=0;i<first;i++)daycells+='<div></div>';for(let i=1;i<=count;i++){let d=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,ts=data.tasks.filter(t=>t.deadline===d),ss=data.scholarships.filter(s=>s.deadline===d);daycells+=`<div class="day ${ts.length+ss.length?'has':''}"><b>${i}</b>${ts.slice(0,2).map(t=>`<span title="${esc(t.title)}">● ${esc(t.title).slice(0,23)}</span>`).join('')}${ss.slice(0,1).map(s=>`<span title="${esc(s.name)}">◆ ${esc(s.name).slice(0,22)}</span>`).join('')}${ts.length+ss.length>3?'<span>+ thêm</span>':''}</div>`}return `<div class="panel"><div class="panelhead"><h2>Tháng ${month+1}/${year}</h2><div class="actions"><button class="btn" onclick="moveMonth(-1)">← Trước</button><button class="btn" onclick="moveMonth(1)">Sau →</button></div></div><div class="month">${daycells}</div><p class="muted small">● Deadline nội bộ (tự đặt) · ◆ Deadline học bổng (cần đối chiếu nguồn chính thức)</p></div>`}function moveMonth(x){month+=x;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}
function profileView(){return `<section class="panel"><h2>Academic & Research Profile</h2><div class="columns">${Object.entries(data.profile).map(([k,v])=>formfield(({university:'Trường',major:'Chuyên ngành',gpa:'GPA',ielts:'IELTS',graduation:'Tốt nghiệp',focus:'Định vị nghiên cứu',publications:'Công bố',research:'Kinh nghiệm nghiên cứu',certs:'Chứng chỉ'})[k]||k,k,v,k==='publications'||k==='research'?'textarea':'text')).join('')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveProfile()">Lưu hồ sơ</button></div></section>`}function saveProfile(){Object.assign(data.profile,Object.fromEntries([...document.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.value])));save();alert('Đã cập nhật hồ sơ')}
function assistantView(){return `<div class="grid2" style="grid-template-columns:1.7fr 1fr"><section class="panel"><div class="panelhead"><h2>✧ Trợ lý học bổng</h2><span class="pill blue">Tra cứu dữ liệu nội bộ</span></div><div id="chat" class="chat">${chatHistory.length?chatHistory.map(m=>`<div class="bubble ${m.role}">${esc(m.text)}</div>`).join(''):`<div class="bubble bot">Xin chào! Mình giúp bạn tìm học bổng, kiểm tra tiến độ, deadline và hướng dẫn cách sử dụng trang web. Mình trả lời từ dữ liệu tracker; không tự xác minh thông tin mới trên Internet.</div>`}</div><div class="chips">${['Học bổng Oxford Optiver có gì?','Học bổng nào ưu tiên rất cao?','Việc nào sắp quá hạn?','Tôi nên chuẩn bị giấy tờ gì?','Cách sử dụng web này?'].map(x=>`<button class="chip" onclick="askPreset('${x}')">${x}</button>`).join('')}</div><div class="chatentry"><input class="input" id="chatInput" placeholder="Hỏi về học bổng, điều kiện, deadline..." onkeydown="if(event.key==='Enter')ask()"><button class="btn primary" onclick="ask()">Gửi →</button></div></section><section class="panel"><h2>Phạm vi trợ lý</h2><p>Trợ lý tích hợp là <b>hỏi đáp theo dữ liệu và quy tắc</b>, hoạt động offline, không sử dụng mô hình AI đám mây.</p><p class="muted">Có thể tìm theo tên học bổng, thống kê tiến độ, nhắc việc và hướng dẫn thao tác. Với câu hỏi phức tạp, cần mô hình AI thực sự và backend an toàn để kết nối API.</p><div class="notice">Không nhập API key của nhà cung cấp AI trực tiếp vào bản HTML này. Nếu triển khai online, tích hợp backend có xác thực, giới hạn truy cập và lưu khóa phía máy chủ.</div><button class="btn" onclick="go('guide')">Xem hướng dẫn →</button></section></div>`}
function askPreset(q){document.getElementById('chatInput').value=q;ask()}function ask(){let el=document.getElementById('chatInput'),q=el.value.trim();if(!q)return;chatHistory.push({role:'user',text:q});chatHistory.push({role:'bot',text:answer(q)});render();let c=document.getElementById('chat');c.scrollTop=c.scrollHeight}
function answer(q){let l=q.toLowerCase();if(/cách dùng|sử dụng|hướng dẫn|web này|chức năng/.test(l))return 'Vào Học bổng để tìm và chỉnh sửa thông tin; Công việc để quản lý deadline và đổi trạng thái; Lịch để xem mốc tháng; Hồ sơ để đánh dấu tài liệu; Giáo sư & liên hệ để theo dõi outreach. Nhớ bấm Sao lưu JSON định kỳ vì dữ liệu lưu trên trình duyệt.';if(/giấy tờ|tài liệu|document|hồ sơ cần/.test(l))return 'Danh mục tài liệu: '+data.documents.map(d=>d.title+' ('+d.status+')').join('; ')+'. Hãy vào mục Hồ sơ để cập nhật từng mục.';if(/quá hạn|sắp hạn|công việc|tiến độ|task/.test(l)){let ls=data.tasks.filter(t=>t.status!=='Hoàn thành'&&days(t.deadline)!==null).sort((a,b)=>a.deadline.localeCompare(b.deadline));return 'Các công việc ưu tiên theo thời gian:\n'+ls.slice(0,7).map(t=>'• '+t.deadline+' — '+t.title+' ('+days(t.deadline)+' ngày)').join('\n')+'\nCác mốc này là kế hoạch nội bộ, không phải deadline trường.'}if(/ưu tiên|tốt nhất|phù hợp/.test(l))return 'Các cơ hội được đánh dấu ưu tiên rất cao trong tracker:\n'+data.scholarships.filter(s=>s.priority==='Rất cao').map(s=>'• '+s.name).slice(0,14).join('\n')+'\nĐây không phải xác suất trúng tuyển. Cần xác minh điều kiện từng chương trình.';let score=s=>{let tokens=l.normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(x=>x.length>2);let text=(s.name+' '+s.school+' '+s.country+' '+s.note).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return tokens.reduce((n,t)=>n+(text.includes(t)?1:0),0)};let matches=data.scholarships.map(s=>({s,n:score(s)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,3);if(matches.length)return matches.map(({s})=>`${s.name} (${s.school})\nBậc: ${s.degree}; Tài trợ: ${s.funding}; Deadline đang lưu: ${s.deadline||'chưa xác minh'}; Ưu tiên: ${s.priority}; Trạng thái: ${s.status}.\nThông tin: ${s.note||'Chưa có ghi chú'}.\nNguồn: ${s.source||'Chưa lưu nguồn'}.`).join('\n\n')+'\nLưu ý: thông tin chưa xác minh không nên dùng để ra quyết định nộp đơn.';return 'Mình chưa tìm thấy thông tin đủ cụ thể trong tracker để trả lời chắc chắn. Hãy hỏi bằng tên trường/học bổng hoặc mở mục Học bổng để bổ sung nguồn chính thức. Trợ lý này không truy cập Internet thời gian thực.'}
function guideView(){return `<section class="panel"><h2>Bắt đầu trong 5 bước</h2><div class="listrow"><b>01 · Chọn cơ hội</b><span class="muted">Lọc theo quốc gia, ưu tiên và trường; mở chi tiết từng học bổng.</span></div><div class="listrow"><b>02 · Kiểm tra nguồn</b><span class="muted">Lưu URL chính thức, eligibility, deadline và trạng thái xác minh.</span></div><div class="listrow"><b>03 · Lập kế hoạch</b><span class="muted">Tạo deadline cá nhân trước hạn trường; dùng công việc và lịch tháng.</span></div><div class="listrow"><b>04 · Chuẩn bị hồ sơ</b><span class="muted">CV, proposal, IELTS, transcript, recommendation và giảng viên hướng dẫn.</span></div><div class="listrow"><b>05 · Sao lưu và triển khai</b><span class="muted">Xuất JSON trước khi đổi thiết bị hoặc xóa dữ liệu trình duyệt.</span></div></section><div class="panel"><h2>Giới hạn & bảo mật</h2><p>Đây là website tĩnh một tệp, chạy không cần cài đặt. Các thay đổi lưu bằng localStorage của trình duyệt hiện tại, không đồng bộ giữa các thiết bị và không gửi thông tin ra server. Dữ liệu có thể mất nếu xóa dữ liệu trình duyệt. Trợ lý là hệ thống tra cứu có quy tắc, chưa phải LLM thực thụ.</p><p>Để trở thành dịch vụ trực tuyến đa thiết bị, cần triển khai backend, tài khoản đăng nhập, cơ sở dữ liệu và endpoint AI bảo mật. Các chức năng thông báo email và cập nhật deadline tự động hiện chưa hoạt động.</p></div><section class="panel"><div class="actions"><button class="btn" onclick="exportData()">Sao lưu JSON</button><button class="btn danger" onclick="resetAll()">Khôi phục dữ liệu mẫu</button></div></section>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='scholarship-atlas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.scholarships)||!Array.isArray(d.tasks)||!Array.isArray(d.documents)||!Array.isArray(d.contacts)||!d.profile)throw Error('Sai cấu trúc');if(confirm('Thay dữ liệu hiện tại bằng bản sao lưu?')){data=d;save();render()}}catch(e){alert('Không thể nhập file: '+e.message)}};reader.readAsText(f);e.target.value=''}function resetAll(){if(confirm('Khôi phục dữ liệu mẫu? Các thay đổi chưa sao lưu sẽ mất.')){data=structuredClone(INITIAL_DATA);save();render()}} 
/* ===== Cloud extensions: optional authenticated syncing, public source monitoring, online AI ===== */
const CLOUD_CFG=window.ATLAS_CONFIG||{};
let supa=null, cloudUser=null, cloudTimer=null, cloudBusy=false, cloudDirty=false;
let feed={generated_at:null,changes:[],sources:[]}, feedError='', cloudMsg='Chưa kết nối',cloudReady=false;
function cloudView(){return `<div class="notice">GitHub Pages chỉ là hosting tĩnh. Tin mới lấy từ GitHub Actions; dữ liệu riêng đồng bộ bằng Supabase khi bạn đăng nhập. Tin mới là tín hiệu cần kiểm tra, không phải deadline đã xác nhận.</div>
<div class="grid2"><section class="panel"><h2>☁ Đồng bộ nhiều thiết bị</h2><div class="cloudbadge" id="cloudStatus">${esc(cloudMsg)}</div>${!cloudReady?`<p>Chưa cấu hình Supabase. Dữ liệu vẫn tự lưu trên trình duyệt, không cần nhập JSON mỗi lần.</p><p class="muted small">Cấu hình URL + anon/public key trong config.js và chạy SQL trong thư mục supabase.</p>`:cloudUser?`<p>Đăng nhập: <b>${esc(cloudUser.email)}</b></p><p>Mỗi thay đổi tự lưu trên cloud, và khi mở thiết bị khác sẽ tải dữ liệu của chính tài khoản này.</p><button class="btn primary" onclick="cloudPush(true)">Đồng bộ ngay</button> <button class="btn" onclick="cloudPull(true)">Tải bản cloud</button> <button class="btn" onclick="cloudSignOut()">Đăng xuất</button>`:`<div class="cloudform"><label>Email</label><input id="cloudEmail" class="input" type="email" placeholder="you@example.com"><label>Mật khẩu</label><input id="cloudPassword" class="input" type="password" placeholder="Ít nhất 8 ký tự"><div class="actions"><button class="btn primary" onclick="cloudSignIn()">Đăng nhập</button><button class="btn" onclick="cloudSignUp()">Tạo tài khoản</button></div><p class="muted small">Đăng ký có thể yêu cầu xác nhận email theo cài đặt Supabase.</p></div>`}</section>
<section class="panel"><h2>✧ AI tư vấn trực tuyến</h2><p>Hỏi AI dựa trên học bổng và hồ sơ trong tracker (không tự tra cứu live). Cần đăng nhập và triển khai Supabase Edge Function; API key chỉ đặt trên server.</p><textarea id="onlineQuestion" class="input" rows="4" placeholder="So sánh Optiver và CSC SEU theo điều kiện của tôi..."></textarea><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="askOnlineAI()">Hỏi AI online</button></div><div id="onlineAnswer" class="feeditem muted">Câu trả lời sẽ hiển thị tại đây và cần kiểm chứng qua nguồn trường.</div></section></div>
<section class="panel"><div class="panelhead"><h2>🔔 Tin mới từ website học bổng</h2><button class="btn" onclick="refreshFeed(true)">Kiểm tra lại</button></div><p class="small muted">Lần kiểm tra: ${esc(feed.generated_at||'Chưa có')} · ${feed.sources.length} nguồn được theo dõi. GitHub Actions chạy theo lịch; không cần upload JSON thủ công.</p>${feedError?`<p class="notice">${esc(feedError)}</p>`:''}<h3 style="font-size:15px;margin-top:18px">Trích đoạn mới nhất tự lấy từ nguồn chính thức</h3>${feed.sources.map(x=>`<div class="feeditem"><b>${esc(x.name)}</b><div class="small muted">${x.status==='ok'?'Đã đọc trang':'Không đọc được trang'} · ${esc(x.checked_at||'')}</div>${(x.excerpts||[]).map(y=>`<p class="small">${esc(y)}</p>`).join('')||'<p class="muted small">Chưa có trích đoạn; mở trang để kiểm tra.</p>'}<a target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">Nguồn chính thức ↗</a></div>`).join('')}<h3 style="font-size:15px">Lịch sử thay đổi</h3>${feed.changes.length?feed.changes.slice(0,45).map(x=>`<div class="feeditem"><b>${esc(x.name||'Thông báo cập nhật')}</b><div class="small muted">${esc(x.checked_at||'')} · ${esc(x.kind||'Thay đổi trang nguồn')} · ${esc(x.summary||'Trang nguồn có thay đổi; vui lòng đọc thông báo chính thức.')}</div><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Mở nguồn chính thức ↗</a></div>`).join(''):'<div class="empty">Chưa ghi nhận thay đổi mới. Chạy workflow lần đầu để tạo báo cáo kiểm tra.</div>'}</section>`}
function cloudSetMsg(v){cloudMsg=v;const e=document.getElementById('cloudStatus');if(e)e.textContent=v}
async function cloudInit(){
  if(!CLOUD_CFG.supabaseUrl||!CLOUD_CFG.supabaseAnonKey){cloudSetMsg('Chế độ local · chưa cấu hình cloud');return}
  try{
    if(!window.supabase?.createClient){cloudSetMsg('Không tải được thư viện Supabase; hãy kiểm tra kết nối');return}
    supa=window.supabase.createClient(CLOUD_CFG.supabaseUrl,CLOUD_CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});cloudReady=true;
    let {data:{session}}=await supa.auth.getSession();cloudUser=session?.user||null;
    supa.auth.onAuthStateChange((event,session)=>{let old=cloudUser?.id;cloudUser=session?.user||null;cloudSetMsg(cloudUser?'Đã đăng nhập · '+cloudUser.email:'Chưa đăng nhập');if(event==='SIGNED_IN'&&cloudUser?.id!==old){setTimeout(()=>cloudPull(false),0)}if(page==='cloud')render()});
    if(cloudUser)await cloudPull(false);else cloudSetMsg('Chưa đăng nhập');
  }catch(e){cloudSetMsg('Lỗi thiết lập: '+e.message)}
}
async function cloudSignUp(){const email=document.getElementById('cloudEmail')?.value.trim(),password=document.getElementById('cloudPassword')?.value;
 if(!email||!password)return alert('Điền email và mật khẩu');const {error}=await supa.auth.signUp({email,password});alert(error?'Lỗi: '+error.message:'Đã gửi yêu cầu đăng ký. Kiểm tra email nếu bật xác thực.');}
async function cloudSignIn(){const email=document.getElementById('cloudEmail')?.value.trim(),password=document.getElementById('cloudPassword')?.value;
 if(!email||!password)return alert('Điền email và mật khẩu');const {error}=await supa.auth.signInWithPassword({email,password});if(error)alert(error.message);}
async function cloudSignOut(){if(!confirm('Đăng xuất? Dữ liệu sẽ tiếp tục được lưu cục bộ trên trình duyệt này.'))return;await supa.auth.signOut();cloudUser=null;render()}
window.cloudScheduleSync=()=>{if(!cloudReady||!cloudUser)return;cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudPush(false),1200)};
async function cloudPush(manual){if(!supa||!cloudUser)return manual&&alert('Cần đăng nhập Supabase');if(cloudBusy){cloudDirty=true;return}cloudBusy=true;cloudDirty=false;cloudSetMsg('Đang đồng bộ...');try{
  let {error}=await supa.from('user_workspaces').upsert({user_id:cloudUser.id,payload:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error)throw error;cloudSetMsg('Đã đồng bộ lúc '+new Date().toLocaleTimeString('vi-VN'));
}catch(e){cloudSetMsg('Lỗi đồng bộ: '+e.message)}finally{cloudBusy=false;if(cloudDirty)window.cloudScheduleSync()}}
async function cloudPull(manual){if(!supa||!cloudUser)return;try{cloudSetMsg('Đang tải dữ liệu cloud...');let {data:row,error}=await supa.from('user_workspaces').select('payload,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;
 if(row?.payload){if(manual&&!confirm('Thay dữ liệu hiện tại bằng bản cloud?'))return;data=row.payload;localStorage.setItem(KEY,JSON.stringify(data));cloudSetMsg('Đã tải bản cloud · '+new Date(row.updated_at).toLocaleString('vi-VN'));render()}
 else {cloudSetMsg('Chưa có bản cloud · tạo bản đầu tiên');await cloudPush(false)}
}catch(e){cloudSetMsg('Lỗi tải dữ liệu: '+e.message)}}
async function refreshFeed(manual){try{const r=await fetch('data/updates.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();feed={generated_at:d.generated_at||null,changes:Array.isArray(d.changes)?d.changes:[],sources:Array.isArray(d.sources)?d.sources:[]};feedError='';if(page==='cloud')render();}catch(e){feedError='Chưa đọc được báo cáo nguồn: '+e.message;if(page==='cloud')render()}}
async function askOnlineAI(){const out=document.getElementById('onlineAnswer'),q=document.getElementById('onlineQuestion')?.value.trim();if(!q)return alert('Nhập câu hỏi');if(!supa||!cloudUser)return alert('Đăng nhập và cấu hình Supabase trước');out.textContent='Đang phân tích...';try{
const {data:sessionData}=await supa.auth.getSession();const r=await fetch(CLOUD_CFG.supabaseUrl.replace(/\/$/,'')+'/functions/v1/assistant',{method:'POST',headers:{'Content-Type':'application/json','apikey':CLOUD_CFG.supabaseAnonKey,'Authorization':'Bearer '+sessionData.session.access_token},body:JSON.stringify({question:q,context:{profile:data.profile,scholarships:data.scholarships.map(x=>({name:x.name,school:x.school,degree:x.degree,deadline:x.deadline,verified:x.verified,source:x.source,eligibility:x.eligibility,priority:x.priority,note:x.note})).slice(0,80),tasks:data.tasks.slice(0,60)}})});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);out.textContent=j.answer||'Không có kết quả';
}catch(e){out.textContent='Lỗi AI: '+e.message}}
window.addEventListener('load',()=>{cloudInit();refreshFeed(false)});

render();</script></body></html>
